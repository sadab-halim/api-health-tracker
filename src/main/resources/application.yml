server:
  port: 8080

spring:
  application:
    name: api-health-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/api_health_tracker
    username: health_user
    password: health_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
      properties:
        linger.ms: 10
        batch.size: 16384
        compression.type: lz4
        enable.idempotence: true
    consumer:
      group-id: metrics-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      max-poll-records: 500
      properties:
        spring.json.trusted.packages: com.healthtracker.domain.model

logging:
  level:
    com.healthtracker: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
