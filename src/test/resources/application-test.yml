spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

app:
  metric-buffer:
    max-size: 100
    batch-size: 50
    flush-interval-ms: 1000

  health-check:
    default-interval-seconds: 5

  anomaly-detection:
    enabled: true
    detection-interval-ms: 10000

  gemini:
    api-key: test-api-key
    timeout-ms: 5000

logging:
  level:
    root: WARN
    com.healthtracker: DEBUG
    org.testcontainers: INFO
